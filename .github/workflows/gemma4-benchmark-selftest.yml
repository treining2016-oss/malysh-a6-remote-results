name: Gemma4 Fail-Closed SWE Benchmark Selftest

on:
  push:
    branches: [main]
    paths:
      - "gemma4-paper/fail-closed-swe-agent-benchmark/**"
      - ".github/workflows/gemma4-benchmark-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run reproducibility self-test
        run: |
          set -euo pipefail
          python3 gemma4-paper/fail-closed-swe-agent-benchmark/harness/selftest.py
