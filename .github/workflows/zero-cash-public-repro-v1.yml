name: zero-cash-public-repro-v1

on:
  push:
    paths:
      - "repro/jobs/current.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-cash-public-repro-v1
  cancel-in-progress: false

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run fixed reproducibility task
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, platform, urllib.request, pathlib

          repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["GITHUB_SHA"]
          token=os.environ["GH_TOKEN"]
          url=f"https://api.github.com/repos/{repo}/contents/repro/jobs/current.json?ref={sha}"
          req=urllib.request.Request(url,headers={
              "Authorization":f"Bearer {token}",
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28",
          })
          with urllib.request.urlopen(req,timeout=30) as r:
              obj=json.load(r)
          raw=base64.b64decode(obj["content"])
          m=json.loads(raw)
          allowed={"env","hash-manifest","numerical-selftest"}
          if m.get("task") not in allowed:
              raise SystemExit("task not allowlisted")
          if not m.get("job_id"):
              raise SystemExit("job_id required")

          out={
              "schema":"MALYSH_ZERO_CASH_PUBLIC_REPRO_RECEIPT_V1",
              "work_id":m.get("work_id"),
              "job_id":m["job_id"],
              "task":m["task"],
              "status":"GREEN",
              "provider":"github_hosted_public_linux",
              "runner_os":os.environ.get("RUNNER_OS"),
              "runner_arch":os.environ.get("RUNNER_ARCH"),
              "github_run_id":os.environ.get("GITHUB_RUN_ID"),
              "github_sha":sha,
              "python":platform.python_version(),
              "cash_spend_usd":0,
          }
          if m["task"]=="hash-manifest":
              out["manifest_sha256"]=hashlib.sha256(raw).hexdigest()
          elif m["task"]=="numerical-selftest":
              vals=[(i*i+3*i+7)%1000003 for i in range(200000)]
              payload=",".join(map(str,vals)).encode()
              out["deterministic_sha256"]=hashlib.sha256(payload).hexdigest()
              out["count"]=len(vals)
          elif m["task"]=="env":
              out["platform"]=platform.platform()
              out["machine"]=platform.machine()

          pathlib.Path("zero-cash-public-repro-receipt.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: zero-cash-public-repro-receipt
          path: zero-cash-public-repro-receipt.json
          if-no-files-found: error
          retention-days: 7
